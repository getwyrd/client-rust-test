# The single source of truth for everything this harness tests against.
#
# Nothing else in the repo may name a revision, a module version, or an image
# tag. `make pins-check` (scripts/check-pins.sh) asserts that every consumer —
# cluster/images.env, rust-toolchain.toml, go/go.mod — agrees with this file.
#
# Why a file and not Cargo.lock: the crate under test is a PATH dependency
# (`tikv-client = { path = "../client-rust" }`), and Cargo records no source or
# rev for a path dep. The lockfile therefore pins NOTHING. This file plus the
# provenance stamp (scripts/provenance.sh) is what closes that hole.

schema = "parity-pins/v1"

# ─────────────────────────────────────────────────────────────────────────────
# The SUBJECT under test.
#
# THE SUBJECT IS THE FORK'S `integration` BRANCH (ADR-0001, docs/design/adr/). It is
# upstream tikv/client-rust plus the getwyrd PRs still waiting upstream, so the loop can
# build on its own unmerged fixes. Two guards keep that honest, both enforced by
# check-pins.sh:
#   - `rev` must be on the first-parent chain of the fork's `branch` — a state the
#     branch has been at, never a stray fork commit or a merged-in PR branch's commit;
#   - `upstream_base` must be exactly where `rev` meets upstream/master (the newest
#     commit on master's first-parent chain that `rev` contains) — the fork never
#     leaves upstream, and the base is never stale.
# Every gap is still filed against tikv/client-rust. CI also runs the parity diff at
# `upstream_base` (informational, never gating) so the upstream view stays visible.
[client_rust]
upstream = "https://github.com/tikv/client-rust.git"
fork     = "https://github.com/getwyrd/client-rust.git"
branch   = "integration"

# integration @ "Merge pull request #9 from getwyrd/ci-integration-revert", 2026-10-25:
# upstream_base plus #558 (TSO deadline), the test-utils probe (tikv/client-rust#577),
# RawClient::checksum (getwyrd/client-rust#6, G-0002's close-gap) and CI time limits, all
# still to go upstream; nothing fork-only. Pin one commit and bump it by hand, as a
# reviewed step: a bump re-states every ledger claim. (Previous pin: 4c9f361 — see README
# § History.)
rev = "385a1a37d6cf0ffe18d499bfcef0650bf9dfcc05"

# master @ "chore: Add IDE components to pinned toolchain (#575)", 2026-10-19.
# Where integration meets upstream master. integration is updated by merges only and is
# never force-pushed (branch protection disables force-pushes; admins are not bound by
# it, so this is also a rule we keep), so every past pin stays reachable. When it merges
# a newer upstream master, move this in the same pin bump.
upstream_base = "1b883bf144a8557938f6069682c61b4d39cf6bf2"

# ─────────────────────────────────────────────────────────────────────────────
# The ORACLE.
#
# Deliberately NOT a sibling path/replace: an oracle you can accidentally edit
# is not an oracle. A pseudo-version `require` is content-addressed via go.sum,
# so it is deterministic by construction and verified on every build.
# The escape hatch for hacking on client-go is a gitignored go.work; CI sets
# GOWORK=off so it can never leak into a result.
[client_go]
module = "github.com/tikv/client-go/v2"
# Canonical pseudo-version resolved by `go list -m`, not hand-derived.
version = "v2.0.8-0.20261014135228-56e5933f0069"
rev     = "56e5933f0069dd390b0327ffc5291eb0a64f1aee"

# ─────────────────────────────────────────────────────────────────────────────
# The cluster.
#
# Digest-pinned, not tag-pinned: `pingcap/pd:v8.5.5` is a mutable tag and can be
# re-pushed. A verdict signed against a floating tag is not reproducible six
# months from now. Tag AND digest together (repo:tag@sha256:...) keeps the
# version human-readable while making the bits immutable.
# v8.5.5 matches client-rust's own CI pin.
[cluster]
tikv_version = "v8.5.5"
pd_image     = "pingcap/pd:v8.5.5@sha256:a043b91dc9a0ad8d1c2a2aa8b84ea3f28c2399f9245683cc83d1603b5ee1df9c"
tikv_image   = "pingcap/tikv:v8.5.5@sha256:1600c2de7432af1f7f23291dcac13b3f82950d4ef722b1f01c3e7b129af64b64"

# The TiKV version MATRIX (scripts/cluster-broker `lease --tikv <version>`). The table
# above is the default — the CI floor every ledger claim is stated against. Each extra
# version is pinned the same way, tag AND digest, and `make pins-check` refuses an entry
# that is not. A verdict from a matrix version is evidence about that version only.
#
# Digests are the multi-platform index digests Docker Hub reported on 2026-10-17. Note
# that `pingcap/tikv:v8.5.5` itself was RE-PUSHED on 2026-08-12 (the tag now points at a
# different index than the one pinned above) — the case digest pinning exists for.
[cluster.versions."v8.5.8"]
pd_image   = "pingcap/pd:v8.5.8@sha256:424e896800e42e1b7eb585b604c8daa3454110d0f0df5ab41f7c5f49164d3aef"
tikv_image = "pingcap/tikv:v8.5.8@sha256:ab84580b6795868940231aa778a34b082d19e4417e6d66f755c609bebdbbfd69"

# ─────────────────────────────────────────────────────────────────────────────
[toolchain]
rust = "1.93.0"    # must equal rust-toolchain.toml, and upstream client-rust's MSRV
go   = "1.25.14"   # must be >= client-go's own `go` directive
