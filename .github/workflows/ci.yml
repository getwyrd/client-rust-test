name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed on the PR number, not the branch name. `github.head_ref` is just the
  # source branch, so two PRs from different forks that both use, say, `patch-1`
  # would share a group — and the newer one would cancel the older one's CI, which
  # reads as a flaky failure on a PR nobody touched.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_LOG: info
  PD_ADDRS: 127.0.0.1:2379
  # Every CI run must be admissible as evidence: refuse to run at all if the
  # crate under test is not at the revision pins.toml names.
  PARITY_STRICT: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Read the pins once. Every other job consumes these outputs, so a revision
  # appears in exactly one place in the whole repo.
  pins:
    runs-on: ubuntu-latest
    outputs:
      client_rust_rev: ${{ steps.p.outputs.client_rust_rev }}
      client_rust_fork: ${{ steps.p.outputs.client_rust_fork }}
      client_rust_upstream: ${{ steps.p.outputs.client_rust_upstream }}
      client_rust_upstream_repo: ${{ steps.p.outputs.client_rust_upstream_repo }}
      client_rust_upstream_base: ${{ steps.p.outputs.client_rust_upstream_base }}
      rust_toolchain:  ${{ steps.p.outputs.rust_toolchain }}
      go_toolchain:    ${{ steps.p.outputs.go_toolchain }}
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships Python >= 3.11, so tomllib is stdlib. Nothing to install.
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib, pathlib
          p = tomllib.loads(pathlib.Path("pins.toml").read_text())
          r = p["client_rust"]
          repo = lambda url: url.removeprefix("https://github.com/").removesuffix(".git")
          print(f"client_rust_rev={r['rev']}")
          print(f"client_rust_fork={repo(r['fork'])}")
          print(f"client_rust_upstream={r['upstream']}")
          print(f"client_rust_upstream_repo={repo(r['upstream'])}")
          print(f"client_rust_upstream_base={r['upstream_base']}")
          print(f"rust_toolchain={p['toolchain']['rust']}")
          print(f"go_toolchain={p['toolchain']['go']}")
          PY

  # ───────────────────────────────────────────────────────────────────────────
  check:
    needs: pins
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client-rust-test } }
    steps:
      - uses: actions/checkout@v4
        with: { path: client-rust-test }

      # Recreate the sibling layout the path dependency expects, at the PINNED
      # revision. This is what makes `tikv-client = { path = "../client-rust" }`
      # deterministic in CI without rewriting the manifest — so a developer's
      # local sibling checkout keeps working untouched.
      #
      # Cloned from the FORK: the subject is its integration branch (ADR-0001).
      # check-pins.sh asserts the pin is on that branch and that upstream_base is on
      # upstream master, so the next step fetches upstream too.
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.client_rust_fork }}
          ref: ${{ needs.pins.outputs.client_rust_rev }}
          path: client-rust
          # Full history: check-pins.sh must resolve origin/<branch>. A shallow clone
          # has no branch refs, and under PARITY_STRICT that is a hard failure.
          fetch-depth: 0
      - name: fetch upstream master (for the upstream_base check)
        working-directory: client-rust
        run: |
          git remote add upstream "${{ needs.pins.outputs.client_rust_upstream }}"
          git fetch --no-tags upstream master

      # No protoc step: client-rust has no build.rs and its `proto-build` member
      # is not in our dependency graph. (Its own CI needs protoc; we do not.)
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client-rust-test }

      # The Go side. Version comes from pins.toml, like everything else — a revision
      # appears in exactly one place in this repo.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.pins.outputs.go_toolchain }}
          cache-dependency-path: client-rust-test/go/go.sum

      # rust-toolchain.toml pins the channel; check-pins.sh asserts it matches.
      # `check` now also runs go vet / go mod verify / gofmt (see the Makefile).
      - run: make check

  # ───────────────────────────────────────────────────────────────────────────
  # The cluster-backed gate.
  #
  # MUST run directly on the VM. cluster/docker-compose.yml uses
  # `network_mode: host`, which shares the runner's network namespace — so PD's
  # advertised 127.0.0.1:2379 is reachable from the test process. Adding a
  # `container:` to this job, or using GitHub `services:` (bridged, random
  # ports), silently breaks that. Linux runners only.
  gate:
    needs: [pins, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: client-rust-test } }
    steps:
      - uses: actions/checkout@v4
        with: { path: client-rust-test }
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.client_rust_fork }}
          ref: ${{ needs.pins.outputs.client_rust_rev }}
          path: client-rust
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client-rust-test }

      # The ORACLE's toolchain. Pinned like everything else.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.pins.outputs.go_toolchain }}
          cache-dependency-path: client-rust-test/go/go.sum

      # Digest-pinned images from pins.toml + wait for PD and a TiKV store Up.
      - name: cluster up
        run: make cluster-up

      # Records the revision actually under test; aborts here (PARITY_STRICT=1)
      # if it is not the pin.
      - name: provenance
        run: make provenance

      - name: unit tests
        run: make unit-test

      # Both suites, checked against the EXPECTED verdict: green except the tests
      # scripts/gate-verdict.sh declares expected-red (none at the current pin: d6 and d7
      # are fixed upstream by #561 and #547 and now guard against a regression).
      # An unexpected PASS of a declared expected-red test fails this job on purpose:
      # it means the gap closed at the pin and the declarations are stale. This also covers the failpoint suite, which
      # `make gate` used to skip entirely.
      - name: verdict (expect green + any declared XFAIL)
        run: make verdict

      # THE PARITY LEDGER. Drives client-rust and client-go through the same scenarios
      # and checks the divergences against their DECLARED expectations.
      #
      # Like `verdict`, a plain pass/fail is meaningless here: each gap declares a
      # polarity. At the current pin G-0001 is FIXED and must AGREE (a divergence fails as
      # NEW GAP); G-0002 must diverge exactly as declared (a convergence fails as XCONVERGE,
      # meaning the gap closed at the pin and the README and the ledger are stale).
      - name: ledger (expect G-0001 HOLDS, G-0002 XDIVERGE)
        run: make ledger

      - name: cluster logs
        if: failure()
        run: make cluster-logs

      - name: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: client-rust-test/results/**
          if-no-files-found: warn

      - name: cluster down
        if: always()
        run: make cluster-down

  # ───────────────────────────────────────────────────────────────────────────
  # THE UPSTREAM VIEW — informational, never gating (ADR-0001).
  #
  # The gate above judges the fork's integration branch. This job runs the parity diff
  # at pins.toml upstream_base, plain tikv/client-rust, so the gaps still open UPSTREAM
  # stay visible: a gap that agrees on integration but diverges here is fixed only in
  # a fork PR that has not merged yet. PARITY_STRICT is off because the subject is
  # deliberately not the pin, so this run is never ledger evidence (ledger-check
  # refuses a strict:false run) — it is only the raw diff, uploaded for reading.
  upstream-view:
    needs: [pins, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      PARITY_STRICT: "0"
    defaults: { run: { working-directory: client-rust-test } }
    steps:
      - uses: actions/checkout@v4
        with: { path: client-rust-test }
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.client_rust_upstream_repo }}
          ref: ${{ needs.pins.outputs.client_rust_upstream_base }}
          path: client-rust
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client-rust-test }
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.pins.outputs.go_toolchain }}
          cache-dependency-path: client-rust-test/go/go.sum
      - name: cluster up
        run: make cluster-up
      - name: parity diff at upstream_base (informational)
        run: make parity
      - name: upstream view
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-view
          path: client-rust-test/results/**
          if-no-files-found: warn
      - name: cluster down
        if: always()
        run: make cluster-down
