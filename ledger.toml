# THE PARITY LEDGER — every gap between tikv/client-rust (the SUBJECT) and
# tikv/client-go (the ORACLE), with a declared expectation and machine-checked evidence.
#
# This file is the verdict. `scripts/ledger-check.sh` proves it against a PINNED run and
# refuses any result whose provenance says strict:false.
#
# ─── THE RULE THAT MAKES THIS HONEST ─────────────────────────────────────────────────
#
# Every entry declares a POLARITY, and the wrong outcome is a HARD FAILURE in BOTH
# directions. This generalizes scripts/gate-verdict.sh from "a substring in stdout" to
# "a field in a trace":
#
#   expect = "diverges"   The gap is OPEN. The two clients MUST differ, and differ in
#                         the PREDICTED way.
#
#     diverged as declared  -> XDIVERGE        correct; the gap is still open.
#     did NOT diverge       -> XCONVERGE       HARD FAILURE. The gap closed upstream, so
#                                              the pin, the README and this ledger are
#                                              all stale. Good news, and loud on purpose:
#                                              without this rule the harness would rot
#                                              into "these are red forever" and nobody
#                                              would notice the day a fix landed.
#     diverged differently  -> WRONG DIVERGENCE HARD FAILURE. They differ, but not as
#                                              predicted, so this run is evidence of
#                                              NOTHING — it may be a broken harness
#                                              rather than a confirmed finding. Accepting
#                                              any difference as proof is exactly how a
#                                              broken harness masquerades as a finding.
#
#   expect = "agrees"     The two clients MUST behave identically here.
#
#     agreed                -> HOLDS
#     diverged              -> NEW GAP         HARD FAILURE. An undeclared difference:
#                                              file it, or fix it. This is the regression
#                                              net, and it is what makes the comparator
#                                              trustworthy — a comparator that only ever
#                                              reports divergence cannot be believed.
#
# A gap is declared FIELD BY FIELD. It is not enough that the clients differ; they must
# differ in the way we said they would.

schema = "parity-ledger/v1"

# ══════════════════════════════════════════════════════════════════════════════════════
# G-0001 — An orphaned lock is never resolved.  FIXED upstream — now a regression guard.
#
# Filed upstream as tikv/client-rust#543. Our fix PR #544 was superseded by #561
# ("recover expired async commit locks", 3408d95): a wider rework of `resolve_locks` that
# includes #544's match-arm change in `check_txn_status` and an equivalent unit test;
# #544 and #543 are closed. The two clients AGREE at 3408d95 and at the pin b10bc69
# (integration), so this entry asserts that they keep agreeing.
# ══════════════════════════════════════════════════════════════════════════════════════
[[gap]]
id     = "G-0001"
slug   = "orphaned-lock-never-resolved"
kind   = "behavioral"
area   = "txn.lock-resolution"
status = "FIXED"

title = "An orphaned lock (primary never written) is never resolved; the key is left unreadable AND unwritable"

expectation = """
A key under a lock whose primary transaction has no lock and no commit/rollback record
must become usable again once the lock's TTL expires: the client must escalate to
rollback_if_not_exist, as client-go's LockResolver does.

Until 3408d95, client-rust did not. `check_txn_status` matched `Error::ExtractedErrors`, but its plan
shape (retry_multi_region -> merge(CollectSingle) -> extract_error) could only ever deliver
the key error as `Error::MultipleKeyErrors` — so the `rollback_if_not_exist` escalation in
`get_txn_status_from_lock` was DEAD CODE. Fixed by tikv/client-rust#561, which matches both
variants; at 3408d95 the reader resolves the orphan and reads `not_found`, as client-go does. Introduced by 7d80f59 (#519); the pre-#519
resolver recovered this state via the legacy Cleanup path.

Since client-rust's test probe (getwyrd/client-rust `test-probes`), each run builds its own
orphan with its own client: all-Go against all-Rust. The mixed case, a Go orphan read by
Rust, which this entry held until then, is G-0003.
"""

scenario = "scenarios/orphaned-lock-resolution.json"
expect   = "agrees"

upstream_issue = "https://github.com/tikv/client-rust/issues/543"
upstream_pr    = "https://github.com/tikv/client-rust/pull/561"   # #544 closed as superseded
finding        = "findings/txn-not-found-lock-resolution.md"

# ─── What this `agrees` claim compares. Any divergence on these is a NEW GAP.
#
# Every step's projection compares `class` (and `class.parts` for a mixed class,
# `unsupported.detail` for an unsupported one), `value`, `commit_ts` (whether present),
# `locks.count`, `locks` (each as key, primary, kind and a TTL bucket), `proto.present`
# and, when a proto is present, `proto.type` (crates/parity-proto/src/project.rs); the
# scenario opts `native.type` in too (`also_compare`). So a regression that re-breaks resolution — the read errors again with
# `MultipleKeyErrors` / `txn_not_found`, and the lock stays — diverges on class,
# native.type, proto and locks, and fails loudly.
#
# Known weakness (getwyrd/client-rust-test#58): the `settle` step waits a fixed 6 s for
# client-go's ASYNC resolver. If that is ever too short, both sides still show the lock,
# and a PARTIAL regression (client-rust reads past the orphan but leaves its lock) would
# agree with a not-yet-settled oracle and HOLD silently. Until #58 lands, a HOLDS here
# proves the read heals, and proves the lock is gone only when the oracle settled.
#
# The open gap's six divergence rows (class, native.type, proto.present, proto.type,
# locks.count, locks at e53837d) are in the git history of this file.

# ══════════════════════════════════════════════════════════════════════════════════════
# G-0002 — RawKV Checksum did not exist in client-rust.  FIXED on the fork — now a
# regression guard.
#
# THE FIRST CAPABILITY CLAIM: the gap was not misbehaviour, it was ABSENCE. client-go
# serves rawkv.Checksum (a server-side crc64 over a range, kvrpcpb.RawChecksumRequest);
# client-rust had no such request type in its plan layer at all (rules doc RAW-4;
# roadmap §5.6) until getwyrd/client-rust#6 added `RawClient::checksum` on the fork's
# `integration` branch, pinned from 385a1a3. The subject's driver now calls it and the two
# clients AGREE, so this entry asserts that they keep agreeing. While the method was
# missing the driver answered `unsupported` — a first-class, comparable observation —
# and did NOT emulate the feature (a client-side scan-and-hash would checksum different
# bytes under different semantics and manufacture agreement out of a workaround); it
# still does not (ADR-0003), and the upstream view, whose client-rust lacks the method,
# still answers `unsupported` there (rust-driver/src/probe.rs, ADR-0001).
#
# The checksum numbers (crc64_xor / total_kvs / total_bytes) are in BOTH traces as
# EVIDENCE ONLY — they cover the key bytes, run prefix included, so they legitimately
# differ between the two runs of this comparison and are never projected.
#
# Not offered upstream: tikv/client-rust master lacks the method, so no `upstream_pr` is
# named here until a PR exists (ADR-0001 reserves the key for the still-open upstream
# PR), and no upstream issue was filed before #6 landed.
# ══════════════════════════════════════════════════════════════════════════════════════
[[gap]]
id     = "G-0002"
slug   = "raw-checksum-unsupported"
kind   = "capability"
area   = "raw.checksum"
status = "FIXED"

title = "RawKV Checksum: client-go computes a server-side crc64 over a range; client-rust sends the same request since getwyrd/client-rust#6"

expectation = """
Asked to checksum a raw key range, both clients answer ok, each carrying the crc64_xor /
total_kvs / total_bytes that TiKV computed for kvrpcpb.RawChecksumRequest.

Until getwyrd/client-rust#6, client-rust exposed no raw checksum anywhere in its API, so
its driver answered `unsupported` rather than emulating one, and this entry declared that
divergence field by field (class, and the `unsupported.detail` the projection surfaces).
#6 added `RawClient::checksum` (src/raw/client.rs) on the fork's `integration` branch;
at the pin 385a1a3 the Rust driver calls it and both sides answer `ok`.
"""

scenario = "scenarios/raw-checksum.json"
expect   = "agrees"

roadmap = "docs/parity-roadmap.md §5.6"
rules   = "docs/design/specs/client-rules/v1.md RAW-4"

# ─── What this `agrees` claim compares. Any divergence on these is a NEW GAP.
#
# Every step's projection compares `class` (and `class.parts` for a mixed class,
# `unsupported.detail` for an unsupported one), `value`, `commit_ts` (whether present),
# `locks.count`, `locks` (each as key, primary, kind and a TTL bucket), `proto.present`
# and, when a proto is present, `proto.type` (crates/parity-proto/src/project.rs); the
# scenario opts nothing else in (no `also_compare`). So a regression that loses the
# capability — the subject answers `unsupported` again, or its call errors where the
# oracle's succeeds — diverges on class and fails loudly.
#
# Known limit (getwyrd/client-rust-test#89): this guard compares the CLASS ONLY. The
# checksum numbers are never projected (crc64_xor and total_bytes differ between the two
# runs by design, and the projection has no path for `total_kvs` yet), so a subject that
# answered `ok` without asking TiKV, or asked it over the wrong range, would HOLD here.
# Until #89 lands, a HOLDS proves the class agrees; the numbers in the trace are what a
# human reads to see that the request really ran over the seeded keys.
#
# The open gap's two divergence rows (class, unsupported.detail; last at 65e5d9c) are in
# the git history of this file.

[[gap]]
id     = "G-0003"
slug   = "orphaned-lock-interop"
kind   = "behavioral"
area   = "txn.lock-resolution"
status = "FIXED"

title = "An orphaned lock left by client-go must be resolvable by a client-rust reader"

expectation = """
The cross-client form of G-0001: a client-go transaction prewrites a secondary under a
primary it never writes and crashes; a client-rust reader must resolve the orphan once
its TTL expires and read `not_found`, as a client-go reader does. Lock records are
TiKV's, not the client's, so the two clients must interoperate on them.

This was G-0001's own subject run until the Rust driver could build the orphan itself;
the same fix (tikv/client-rust#561) closed it.
"""

scenario = "scenarios/orphaned-lock-interop.json"
expect   = "agrees"

upstream_issue = "https://github.com/tikv/client-rust/issues/543"
upstream_pr    = "https://github.com/tikv/client-rust/pull/561"
finding        = "findings/txn-not-found-lock-resolution.md"
